<svg class="hero-art" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#071019"/><stop offset=".5" stop-color="#0F2637"/><stop offset="1" stop-color="#1D4058"/>
      </linearGradient>
      <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FBE0AC"/><stop offset="1" stop-color="#CBA15A"/>
      </linearGradient>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C4BDAE"/><stop offset="1" stop-color="#8D8677"/>
      </linearGradient>
      <linearGradient id="drive" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5D5A52"/><stop offset="1" stop-color="#2A2E33"/>
      </linearGradient>
      <radialGradient id="up" cx=".5" cy="1" r=".75">
        <stop offset="0" stop-color="#F2CE8C" stop-opacity=".5"/><stop offset="1" stop-color="#F2CE8C" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="halo" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#F5D79B" stop-opacity=".38"/><stop offset="1" stop-color="#F5D79B" stop-opacity="0"/>
      </radialGradient>
      <g id="palm">
        <path d="M0 0 C-7 -62 5 -124 -3 -182" stroke="#060F18" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M0 0 C-7 -62 5 -124 -3 -182" stroke="#16303F" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
        <g fill="#060F18">
          <path d="M-3 -180 C-44 -206 -88 -200 -118 -172 C-80 -188 -40 -188 -3 -170Z"/>
          <path d="M-3 -180 C38 -210 82 -204 112 -176 C74 -192 34 -192 -3 -170Z"/>
          <path d="M-3 -184 C-26 -224 -16 -258 10 -276 C-2 -244 -1 -212 3 -178Z"/>
          <path d="M-3 -184 C24 -222 60 -238 94 -236 C58 -224 26 -204 3 -176Z"/>
          <path d="M-3 -184 C-32 -220 -66 -234 -100 -232 C-64 -222 -30 -202 -3 -176Z"/>
          <path d="M-3 -184 C-14 -216 -34 -240 -60 -250 C-38 -232 -18 -208 -3 -178Z"/>
        </g>
      </g>
    </defs>

    <rect width="1200" height="780" fill="url(#sky)"/>
    <g fill="#EAF2F8" opacity=".5">
      <circle cx="140" cy="70" r="1.6"/><circle cx="330" cy="42" r="1.2"/><circle cx="520" cy="96" r="1.5"/>
      <circle cx="760" cy="52" r="1.3"/><circle cx="960" cy="110" r="1.6"/><circle cx="1090" cy="60" r="1.2"/>
      <circle cx="240" cy="150" r="1"/><circle cx="660" cy="140" r="1"/>
    </g>
    <ellipse cx="600" cy="560" rx="620" ry="150" fill="#F0C97E" opacity=".07"/>

    <!-- house -->
    <g>
      <!-- left wing -->
      <rect x="300" y="392" width="250" height="176" fill="url(#wall)"/>
      <path d="M286 396 L425 322 L564 396 Z" fill="#111E28"/>
      <path d="M286 396 L564 396 L556 404 L294 404 Z" fill="#22333F"/>
      <!-- main block -->
      <rect x="546" y="336" width="330" height="232" fill="url(#wall)"/>
      <path d="M530 340 L711 246 L892 340 Z" fill="#111E28"/>
      <path d="M530 340 L892 340 L884 349 L538 349 Z" fill="#22333F"/>
      <!-- right wing / garage -->
      <rect x="872" y="404" width="212" height="164" fill="url(#wall)"/>
      <path d="M858 408 L978 344 L1098 408 Z" fill="#111E28"/>
      <path d="M858 408 L1098 408 L1090 416 L866 416 Z" fill="#22333F"/>

      <!-- warm interior halos -->
      <ellipse cx="620" cy="430" rx="120" ry="90" fill="url(#halo)"/>
      <ellipse cx="800" cy="440" rx="110" ry="85" fill="url(#halo)"/>
      <ellipse cx="390" cy="470" rx="95" ry="70" fill="url(#halo)"/>

      <!-- upper windows -->
      <g fill="url(#win)">
        <rect x="596" y="372" width="52" height="70" rx="2"/>
        <rect x="672" y="372" width="52" height="70" rx="2"/>
        <rect x="748" y="372" width="52" height="70" rx="2"/>
        <rect x="336" y="428" width="44" height="58" rx="2"/>
        <rect x="404" y="428" width="44" height="58" rx="2"/>
        <rect x="472" y="428" width="44" height="58" rx="2"/>
      </g>
      <!-- entry + lower glazing -->
      <rect x="588" y="470" width="76" height="98" fill="url(#win)"/>
      <rect x="686" y="470" width="60" height="98" fill="url(#win)" opacity=".9"/>
      <rect x="768" y="470" width="60" height="98" fill="url(#win)" opacity=".78"/>
      <!-- mullions -->
      <g stroke="#3A3226" stroke-width="2.6" opacity=".85">
        <path d="M622 372v70M698 372v70M774 372v70M596 405h204M336 428v58M358 428h22M426 428v58M494 428v58"/>
        <path d="M626 470v98M588 512h76M716 470v98M798 470v98"/>
      </g>
      <!-- columns -->
      <g fill="#D6D0C2">
        <rect x="566" y="440" width="14" height="128"/><rect x="668" y="440" width="12" height="128"/>
        <rect x="756" y="440" width="12" height="128"/><rect x="854" y="440" width="14" height="128"/>
      </g>
      <path d="M556 434 h322 v10 h-322 Z" fill="#E2DCCE"/>
      <!-- garage door (wood) -->
      <rect x="914" y="452" width="132" height="116" fill="#7A5B32"/>
      <g stroke="#5C4324" stroke-width="2">
        <path d="M914 480h132M914 508h132M914 536h132"/>
      </g>
      <rect x="914" y="446" width="132" height="8" fill="#D6D0C2"/>
      <!-- sconces -->
      <g fill="#F5D79B"><circle cx="902" cy="470" r="4"/><circle cx="1058" cy="470" r="4"/><circle cx="576" cy="462" r="4"/></g>
    </g>

    <!-- ground -->
    <rect x="0" y="560" width="1200" height="220" fill="#16232E"/>
    <path d="M330 568 L1200 568 L1200 780 L120 780 Z" fill="url(#drive)"/>
    <g stroke="#7C7A72" stroke-width="1.4" opacity=".3">
      <path d="M360 600 L1200 600M330 640 L1200 640M280 690 L1200 690M215 745 L1200 745"/>
      <path d="M470 568 L430 780M620 568 L620 780M770 568 L800 780M920 568 L980 780"/>
    </g>
    <!-- uplight cones -->
    <ellipse cx="576" cy="600" rx="130" ry="70" fill="url(#up)"/>
    <ellipse cx="900" cy="606" rx="120" ry="64" fill="url(#up)"/>
    <ellipse cx="380" cy="612" rx="110" ry="60" fill="url(#up)"/>
    <!-- hedges -->
    <g fill="#0D1B22">
      <ellipse cx="316" cy="566" rx="46" ry="20"/><ellipse cx="530" cy="566" rx="38" ry="17"/>
      <ellipse cx="866" cy="568" rx="42" ry="18"/><ellipse cx="1096" cy="570" rx="52" ry="22"/>
    </g>
    <!-- lawn -->
    <path d="M0 560 L330 568 L120 780 L0 780 Z" fill="#0E2029"/>

    <!-- palms -->
    <use href="#palm" transform="translate(178 772) scale(1.4)"/>
    <use href="#palm" transform="translate(1082 648) scale(1.05)"/>
    <use href="#palm" transform="translate(1178 742) scale(1.25)"/>
    <use href="#palm" transform="translate(128 606) scale(.62)"/>
    <use href="#palm" transform="translate(1012 596) scale(.72)"/>
  </svg>