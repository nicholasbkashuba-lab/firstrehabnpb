name: zz-reframe
on: push
permissions:
  contents: write
jobs:
  reframe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sabesan-relay
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m py_compile "$GITHUB_WORKSPACE/pipeline/reframe.py"
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
      - name: Fetch v4 master + edl
        run: |
          set -euo pipefail
          git fetch origin tmp/sabesan-out
          git archive origin/tmp/sabesan-out | tar -x -C /mnt/work
          cd /mnt/work
          cat master.chunk_* > master.mp4 && rm master.chunk_*
          sha256sum -c master.sha256
      - name: Download cam-c
        run: |
          cd /mnt/work
          curl -sS --fail --retry 2 -L -o cam-c.mov "https://uc426b83b527abe1a54edb43de95.dl.dropboxusercontent.com/cd/0/get/DFVSuugbkuqxG7juWAi94hR46mng2j30GvJqu4QjwjrdagFQRWd-W-Sdejvf0XknBfuIBmcc9DIpBdUVJ8DmAKOp-UuOTfAYvQX7buauqp1Kg47TgDj1wAJF4E4M8H0HI5C9mUUX1SHv2N8l9pPFpTqr2FNmqEaF0_TQrq8eJ5wL9g/file?c_luid=b636c39b"
          [ "$(stat -c%s cam-c.mov)" = "6162358143" ]
      - name: Reframe guest shots (y=850)
        run: |
          export WORK=/mnt/work
          python3 "$GITHUB_WORKSPACE/pipeline/reframe.py"
      - name: Publish final
        run: |
          set -euo pipefail
          cd /mnt/work/out
          split -b 90m -d master.mp4 master.chunk_
          sha256sum master.mp4 > master.sha256
          rm master.mp4
          cd /mnt/work
          for f in edl_v4.json transcript_v4.json spans_v4.json; do cp $f out/$f; done
          cd $GITHUB_WORKSPACE
          git checkout --orphan tmp/sabesan-final
          git rm -rf -q . || true
          cp -r /mnt/work/out/* .
          git add -A
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git commit -q -m "sabesan FINAL: y=850 guest framing"
          git push -f origin HEAD:tmp/sabesan-out
