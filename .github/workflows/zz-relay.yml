name: zz-sabesan-edit
on: push
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sabesan-relay
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper librosa numpy
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
          df -h / /mnt | tail -3
      - name: Preflight (fail before links get consumed, not after)
        run: |
          python3 -m py_compile "$GITHUB_WORKSPACE/pipeline/edit.py" "$GITHUB_WORKSPACE/pipeline/download.py"
          python3 -c "import numpy, librosa, faster_whisper; print('imports ok')"
          ffmpeg -version | head -1
      - name: Download sources (parallel — links are short-lived)
        run: |
          set -euo pipefail
          cd /mnt/work
          python3 "$GITHUB_WORKSPACE/pipeline/download.py"
          df -h / /mnt | tail -3
      - name: Edit
        run: |
          export WORK=/mnt/work
          python3 $GITHUB_WORKSPACE/pipeline/edit.py
          df -h / /mnt | tail -3
      - name: Publish outputs to tmp/sabesan-out
        run: |
          set -euo pipefail
          cd /mnt/work/out
          split -b 90m -d master.mp4 master.chunk_
          sha256sum master.mp4 > master.sha256
          rm master.mp4
          cd $GITHUB_WORKSPACE
          git checkout --orphan tmp/sabesan-out
          git rm -rf -q . || true
          cp -r /mnt/work/out/* .
          git add -A
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git commit -q -m "sabesan multicam master + verification pack"
          git push -f origin HEAD:tmp/sabesan-out
