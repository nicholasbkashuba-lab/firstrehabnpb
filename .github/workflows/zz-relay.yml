name: zz-clips
on: push
permissions:
  contents: write
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sabesan-relay
      - name: Setup + preflight
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          python3 -m py_compile "$GITHUB_WORKSPACE/pipeline/clips.py"
          python3 -c "import faster_whisper; print('fw ok')"
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
      - name: Fetch final master + spans
        run: |
          set -euo pipefail
          git fetch origin tmp/sabesan-out
          git archive origin/tmp/sabesan-out | tar -x -C /mnt/work
          cd /mnt/work
          cat master.chunk_* > master.mp4 && rm master.chunk_*
          sha256sum -c master.sha256
      - name: Download cameras
        run: |
          set -euo pipefail
          cd /mnt/work
          curl -sS --fail --retry 2 -L -o cam-a.mov "https://uc85f86610d96b34a5c26f4ae0be.dl.dropboxusercontent.com/cd/0/get/DFX3HGuQqH94s8BS3qBX39JU6js_9Fmxaentzhx0_pYRY5viCJVOVDkZaViLDogFGvJPwVMcutnse4s7rKt1JXlAqWJhq9N8CVyLkHgWSHAiTe7SZbnHbNUZBzSMDaX1Y-u8gM6vLcYxrbO3BVV7UpImY6QYkBvMvZK3mvFUuBInkw/file?c_luid=b636c39b" &
          curl -sS --fail --retry 2 -L -o cam-c.mov "https://ucdd4a38377da9be5996bae2ec60.dl.dropboxusercontent.com/cd/0/get/DFVxJYyOtXkaiy8lk2gIdzxMFbNj9ugWbSeYM4-cPzyt2RWmm1PpA8a8KCs57wbA-eNySmRDPlRp9Uwm5LQwrRDfMNLadbw2nTh3e6ekVlQjur-KmQs4WVePI9SQJeN1p8W-Gdg3aatBFphw5AQd1Yu5M4Kv05DlV8ARWcO7Cz18Cg/file?c_luid=b636c39b" &
          wait
          [ "$(stat -c%s cam-a.mov)" = "5799444823" ]
          [ "$(stat -c%s cam-c.mov)" = "6162358143" ]
      - name: Render clips + transcripts
        run: |
          export WORK=/mnt/work
          python3 "$GITHUB_WORKSPACE/pipeline/clips.py"
      - name: Publish clips
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          git checkout --orphan tmp/sabesan-clips-b
          git rm -rf -q . || true
          cp -r /mnt/work/out/* .
          git add -A
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git commit -q -m "10 vertical social clips + medium.en transcripts"
          git push -f origin HEAD:tmp/sabesan-clips
