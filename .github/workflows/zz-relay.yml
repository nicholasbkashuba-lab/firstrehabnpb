name: zz-dbx-probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe Dropbox file-request upload flow
        run: |
          set -uo pipefail
          # fetch the file request page and look for the upload bootstrap data
          curl -sL -c jar.txt -o page.html "https://www.dropbox.com/request/1pgnu2eja69w8g2ow9ul"
          echo "page bytes: $(stat -c%s page.html)"
          grep -o 'file_request[^"]*' page.html | sort -u | head -20
          # js token candidates
          grep -oE '"(TOKEN|token|uploadUrl|upload_url)"[^,}]{0,120}' page.html | head -20
          grep -oE 'dl-web[^"]{0,80}' page.html | head -10
          grep -oE '"id":"[^"]*"' page.html | head -5
          echo "--- attempting known upload endpoint with test file ---"
          echo "probe $(date -u)" > test.txt
          # historical endpoint pattern (may 404/403 — this is a probe)
          curl -s -b jar.txt -X POST \
            "https://dl-web.dropbox.com/file_request/upload/1pgnu2eja69w8g2ow9ul" \
            -F "file=@test.txt" -w "\nupload HTTP %{http_code}\n" | tail -3
