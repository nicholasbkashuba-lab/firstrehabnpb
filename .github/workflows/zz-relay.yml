name: zz-frames-to-branch
on: push
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sabesan-relay
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          run-id: 30633184037
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: allframes
          merge-multiple: true
      - name: Commit frames
        run: |
          ls -la allframes/
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add allframes
          git commit -m "reference frames from all angles"
          git push origin HEAD:tmp/sabesan-relay
