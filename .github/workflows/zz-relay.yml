name: zz-finish-v3
on: push
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/sabesan-relay
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          sudo mkdir -p /mnt/work && sudo chown $USER /mnt/work
          python3 -m py_compile "$GITHUB_WORKSPACE/pipeline/finish.py"
      - name: Fetch v1 master (audio + edl) from out branch
        run: |
          set -euo pipefail
          git fetch origin tmp/sabesan-out
          git archive origin/tmp/sabesan-out | tar -x -C /mnt/work
          cd /mnt/work
          cat master.chunk_* > master.mp4 && rm master.chunk_*
          ls -la edl.json master.mp4
      - name: Download cameras (parallel)
        run: |
          set -euo pipefail
          cd /mnt/work
          curl -sS --fail --retry 2 -L -o cam-a.mov "https://uca77287db296f208d216376eced.dl.dropboxusercontent.com/cd/0/get/DFQrfTjusEhHOOcGirbTLI6lEsvIxE0l15e2xeBjNYreDOmZOMBKcD6soungLmzXFLuysMde-tsGRisFaMkebS1vZmjglxK3snaHgs13izgD7ngs4skJuM66pO6ATIFAiO-ktKM2y4fuoeQ_-808fbt8sXFnOc3kf81TPWDCSiaDwg/file?c_luid=b636c39b" &
          curl -sS --fail --retry 2 -L -o cam-b.mov "https://uc6ca3f72c0d7352877a715c2b4a.dl.dropboxusercontent.com/cd/0/get/DFSf_YB0z7MWlWrnGNHwjs-M7p4V25d1jQvdeFYmh1XiROdy3uDr7E80Fj67--aF5FOtHinTu7PGG_YXaSvLEvR_eJvQqUJM6H2ioeVSjIsldiNVl_R128WmVIRe4ypwHQZLn2sumTn75l3cCi-jZOKrOSshh2SsbLL1ec25FOI3EQ/file?c_luid=b636c39b" &
          curl -sS --fail --retry 2 -L -o cam-c.mov "https://uc39187f4fd1a12522944bae63ad.dl.dropboxusercontent.com/cd/0/get/DFQpGQz46qWhUoqAhVomWcTiGFjS-cX8njxYBpb3QKX7u44_BhWMyBSsNIRM12R_TtpI9TQ3ARj80LMxMTtV4sM26ZsN-zpqwvlhBZgKDLe5vWKwnubxw6fPolTOX0OVci4kNre24M-xlCIPL_rzfhAzWakAUscfHaeas-7f4s_JPQ/file?c_luid=b636c39b" &
          wait
          [ "$(stat -c%s cam-a.mov)" = "5799444823" ]
          [ "$(stat -c%s cam-b.mov)" = "6222098919" ]
          [ "$(stat -c%s cam-c.mov)" = "6162358143" ]
          echo all sizes ok
      - name: Render v3 (tonemap + corrected crop)
        run: |
          export WORK=/mnt/work
          python3 "$GITHUB_WORKSPACE/pipeline/finish.py"
      - name: Publish v3
        run: |
          set -euo pipefail
          cd /mnt/work/out
          split -b 90m -d master.mp4 master.chunk_
          sha256sum master.mp4 > master.sha256
          rm master.mp4
          cd /mnt/work
          for f in edl.json transcript.json sync.json audio_map.json; do cp $f out/$f; done
          cd $GITHUB_WORKSPACE
          git checkout --orphan tmp/sabesan-v3
          git rm -rf -q . || true
          cp -r /mnt/work/out/* .
          git add -A
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git commit -q -m "sabesan master v3: HLG tonemap + corrected guest crop"
          git push -f origin HEAD:tmp/sabesan-out
