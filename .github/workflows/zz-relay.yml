    steps:
      - name: Relay ${{ matrix.name }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sS --fail --retry 3 --retry-delay 5 -L -o clip.mov "${{ matrix.src }}"
          got=$(stat -c%s clip.mov)
          [ "$got" = "${{ matrix.size }}" ] || { echo "SIZE MISMATCH got=$got want=${{ matrix.size }}"; exit 1; }
          if [ -n "${{ matrix.dst }}" ]; then
            curl -sS --fail --retry 3 --retry-delay 5 -X PUT -H "Content-Type: application/octet-stream" --upload-file clip.mov "${{ matrix.dst }}"
            echo "UPLOADED ${{ matrix.name }}"
          fi
          # reference frames + audio level, for angle identification and audio pick
          mkdir -p frames
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 clip.mov)
          for pct in 10 50 90; do
            t=$(python3 -c "print($dur*$pct/100)")
            ffmpeg -v error -y -ss "$t" -i clip.mov -frames:v 1 -vf scale=640:-2 -q:v 4 "frames/${{ matrix.name }}-$pct.jpg" || true
          done
          ffmpeg -hide_banner -nostats -t 300 -i clip.mov -af volumedetect -f null /dev/null 2>&1 | grep -E "mean_volume|max_volume" || true
          ls -la frames/
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.name }}
          path: frames/
