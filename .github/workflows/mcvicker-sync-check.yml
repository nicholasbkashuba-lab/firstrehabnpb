name: mcvicker-sync-check
on:
  push:
    branches:
      - tmp/mcvicker-sync-check
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Self-delete this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X DELETE -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/git/refs/heads/tmp/mcvicker-sync-check
