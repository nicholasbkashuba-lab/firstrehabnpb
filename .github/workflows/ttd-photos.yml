name: ttd-photos
on:
  push:
    branches: [tmp/ttd-photos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.email "actions@github.com"; git config user.name "GitHub Actions Relay"
          mkdir /tmp/o && cp -r out/* /tmp/o/
          git checkout --orphan tmp/ttd-photos-out && git rm -rfq . && cp -r /tmp/o/* . && git add -A
          git commit -qm "Commons candidates + official pages" && git push -f origin tmp/ttd-photos-out
