name: joyce-relay
on:
  repository_dispatch:
    types: [relay-fetch]
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch master v2 from Dropbox and chunk
        env:
          DL_URL: ${{ github.event.client_payload.download_url }}
        run: |
          curl -L -f -o master.mp4 "$DL_URL"
          ls -la master.mp4
          size=$(stat -c%s master.mp4)
          if [ "$size" -lt 1000000000 ]; then echo "FILE TOO SMALL, ABORTING"; exit 1; fi
          sha256sum master.mp4 > master.sha256
          cat master.sha256
          split -b 90m master.mp4 master.chunk_
          ls -la master.chunk_* | head
      - name: Push chunks to tmp/joyce-out
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions Relay"
          mkdir -p /tmp/relay-out
          cp master.chunk_* master.sha256 /tmp/relay-out/
          git checkout --orphan tmp/joyce-out
          git rm -rf . 2>/dev/null || true
          cp /tmp/relay-out/* .
          git add master.chunk_* master.sha256
          git commit -m "Relay Paul Joyce multicam v2 master"
          git push -f origin tmp/joyce-out
