# Keeps the committed site in step with build.py.
#
# build.py is the single source of truth and the generated pages are committed,
# because Vercel serves this repo as static files. Two jobs, one workflow:
#
#   check    Pull requests, and any push to main that a person made. Read-only.
#            Rebuilds and fails if anything moved, so a source-only change can
#            never land silently. It does NOT push.
#
#   publish  A push to main whose commit message carries the JARVIS marker below.
#            JARVIS (the agency portal) can only commit SOURCE (an entry in
#            build.py); it never runs the build. This job runs build.py and
#            commits what it regenerates, so the post goes live. This workflow
#            run's conclusion is what the portal reads as "published".
#
# The write permission is granted to the publish job only. Commits pushed with
# GITHUB_TOKEN do not trigger new workflow runs, so publish cannot loop.
name: rebuild

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rebuild-${{ github.ref }}
  # Only cancel superseded PR runs. Cancelling a publish run would leave a
  # JARVIS commit un-built and the portal reading it as failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: committed output matches build.py
    if: >-
      github.event_name == 'pull_request' ||
      !contains(github.event.head_commit.message, 'Published from the JARVIS content queue')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # build.py is stdlib only, so there is nothing to install.
      - name: Rebuild the site
        run: python3 build.py

      - name: Check for drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Committed output matches build.py."
            exit 0
          fi
          echo "::error::The committed site does not match what build.py generates. Run 'python3 build.py' and commit the result."
          echo
          echo "Files that build.py changed or created:"
          git status --porcelain
          echo
          git --no-pager diff --stat
          echo
          echo "Fix: run 'python3 build.py' locally and commit every file it touches."
          echo "sitemap-dates.json counts: it carries each page's real lastmod, and"
          echo "leaving it out makes every page claim it changed today."
          exit 1

  publish:
    name: rebuild and commit JARVIS publish
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'Published from the JARVIS content queue')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, same as the sibling Actions, so anything derived from
          # git history sees real dates.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the site
        run: python3 build.py

      - name: Commit rebuilt pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Build produced no changes."
            exit 0
          fi
          git commit -m "Rebuild site

          Regenerated by the rebuild workflow from ${GITHUB_SHA}."
          # main may have moved while this ran; retry on top of it.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Could not push the rebuilt pages after 3 attempts."
          exit 1
